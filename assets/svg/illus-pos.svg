<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" fill="none">
  <defs>
    <linearGradient id="p-arc" x1="210" y1="10" x2="210" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EFEAFE"/><stop offset="1" stop-color="#F7F5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="p-body" x1="140" y1="120" x2="280" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B2EE5"/><stop offset="1" stop-color="#3A1AA6"/>
    </linearGradient>
    <linearGradient id="p-screen" x1="150" y1="90" x2="270" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="p-metal" x1="60" y1="150" x2="130" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4C2AD6"/><stop offset="1" stop-color="#2E1580"/>
    </linearGradient>
  </defs>

  <!-- lengkungan latar + lampu gantung -->
  <path d="M60 290V150a150 150 0 0 1 300 0v140H60Z" fill="url(#p-arc)"/>
  <path d="M120 30v34" stroke="#C9BEF6" stroke-width="3"/>
  <path d="M104 64h32l-8 16h-16l-8-16Z" fill="#D6CDF8"/>
  <path d="M310 30v46" stroke="#C9BEF6" stroke-width="3"/>
  <path d="M294 76h32l-8 16h-16l-8-16Z" fill="#D6CDF8"/>

  <!-- rak samping -->
  <rect x="292" y="120" width="86" height="8" rx="4" fill="#E4DDFA"/>
  <rect x="300" y="96" width="16" height="24" rx="5" fill="#DCD3F8"/>
  <rect x="324" y="102" width="14" height="18" rx="5" fill="#DCD3F8"/>
  <rect x="346" y="92" width="16" height="28" rx="5" fill="#DCD3F8"/>

  <!-- printer struk -->
  <rect x="48" y="182" width="86" height="58" rx="14" fill="url(#p-metal)"/>
  <rect x="62" y="196" width="58" height="8" rx="4" fill="#FFFFFF" fill-opacity=".55"/>
  <path d="M64 158h50a6 6 0 0 1 6 6v26H58v-26a6 6 0 0 1 6-6Z" fill="#FFFFFF"/>
  <rect x="70" y="166" width="30" height="4" rx="2" fill="#C3B8F3"/>
  <rect x="70" y="176" width="22" height="4" rx="2" fill="#DCD6F6"/>

  <!-- badan mesin kasir -->
  <rect x="140" y="196" width="150" height="56" rx="16" fill="url(#p-body)"/>
  <rect x="182" y="216" width="66" height="10" rx="5" fill="#FFFFFF" fill-opacity=".45"/>
  <rect x="196" y="176" width="38" height="24" rx="6" fill="#3A1AA6"/>

  <!-- layar tablet -->
  <rect x="146" y="76" width="138" height="106" rx="16" fill="url(#p-body)"/>
  <rect x="156" y="86" width="118" height="86" rx="10" fill="url(#p-screen)"/>
  <!-- sidebar mini di layar -->
  <rect x="162" y="92" width="30" height="74" rx="7" fill="#5B2EE5" fill-opacity=".12"/>
  <rect x="167" y="98" width="20" height="18" rx="6" fill="#5B2EE5"/>
  <rect x="167" y="122" width="20" height="4" rx="2" fill="#5B2EE5" fill-opacity=".35"/>
  <rect x="167" y="132" width="20" height="4" rx="2" fill="#5B2EE5" fill-opacity=".25"/>
  <rect x="167" y="142" width="20" height="4" rx="2" fill="#5B2EE5" fill-opacity=".2"/>
  <!-- grid produk di layar -->
  <g fill="#5B2EE5" fill-opacity=".16">
    <rect x="200" y="98" width="20" height="20" rx="6"/>
    <rect x="226" y="98" width="20" height="20" rx="6"/>
    <rect x="252" y="98" width="16" height="20" rx="6"/>
    <rect x="200" y="124" width="20" height="20" rx="6"/>
    <rect x="226" y="124" width="20" height="20" rx="6"/>
    <rect x="252" y="124" width="16" height="20" rx="6"/>
    <rect x="200" y="150" width="20" height="14" rx="5"/>
    <rect x="226" y="150" width="42" height="14" rx="5"/>
  </g>

  <!-- pemindai barcode -->
  <path d="M330 168c10-6 22-2 26 8l16 42c3 8-1 16-9 19s-16-1-19-9l-16-42c-3-8-6-14 2-18Z" fill="url(#p-metal)"/>
  <rect x="332" y="150" width="26" height="18" rx="7" fill="#6B3AF2" transform="rotate(-18 332 150)"/>
  <path d="M300 196h22" stroke="#8B6BF2" stroke-width="4" stroke-linecap="round"/>

  <!-- tanaman kecil -->
  <path d="M388 240c0-16 8-28 8-28s8 12 8 28c0 10-4 14-8 14s-8-4-8-14Z" fill="#CFC6F7"/>
  <rect x="382" y="252" width="30" height="26" rx="7" fill="#B7AAF3"/>

  <!-- lantai -->
  <ellipse cx="210" cy="264" rx="150" ry="14" fill="#E6E1FA"/>
</svg>
