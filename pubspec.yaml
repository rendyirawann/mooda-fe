name: mooda_fe
description: "Mooda Mobile (F&B / Dine) — Flutter frontend, ringan & only-hit-API ke Mooda BE (api.mooda.id)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.7.0                 # HTTP client (only-hit-API)
  shared_preferences: ^2.3.2 # simpan token
  intl: ^0.20.2              # format Rupiah / tanggal
  flutter_svg: ^2.0.10       # aset dekoratif & ilustrasi (SVG)
  permission_handler: ^11.3.1 # minta izin runtime (lokasi, kamera, media)
  lucide_icons_flutter: ^3.1.17
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.2.2
  url_launcher: ^6.3.2
  universal_ble: ^2.1.1
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/svg/

  fonts:
    # Font utama seluruh UI.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    # Khusus angka besar / headline. Manrope hanya tersedia sebagai variable font,
    # jadi ketebalannya diatur lewat FontVariation('wght') — lihat MoodaTheme.number().
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf

# Ikon aplikasi memakai logo mark Mooda.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/mooda-mark-512.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/mooda-mark-512.png"
