name: mooda_fe
description: "Mooda Mobile (F&B / Dine) — Flutter frontend, ringan & only-hit-API ke Mooda BE (api.mooda.id)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.7.0                 # HTTP client (only-hit-API)
  shared_preferences: ^2.3.2 # simpan token
  intl: ^0.19.0              # format Rupiah / tanggal
  flutter_svg: ^2.0.10       # aset dekoratif & ilustrasi (SVG)
  permission_handler: ^11.3.1 # minta izin runtime (lokasi, kamera, media)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/svg/

# Ikon aplikasi memakai logo mark Mooda.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/mooda-mark-512.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/mooda-mark-512.png"
